<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BCIT Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Chivo+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column gym clipboard. Sticky strip with two big day-type buttons (Cardio / Weight) and a row of session chips, exercise rows with round "plate" set buttons, rest timer docked to the bottom. */
:root{
  --bg:#E7EBE9; --surface:#F5F7F6; --ink:#131916; --muted:#56615B; --line:#C6CDC9;
  --red:#C22F28; --blue:#2356B3; --yellow:#E2A900; --green:#2B8249; --graphite:#48534E; --orange:#B4540F;
  --on-red:#FFFFFF; --on-blue:#FFFFFF; --on-yellow:#1A1600; --on-green:#FFFFFF; --on-graphite:#FFFFFF; --on-orange:#FFFFFF;
  --focus:#2356B3;
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:"Chivo Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#191E1C; --ink:#E6EBE8; --muted:#9BA6A0; --line:#2E3532;
    --red:#EC6158; --blue:#6E9BEF; --yellow:#F2C230; --green:#56C17D; --graphite:#98A39E; --orange:#F0954A;
    --on-red:#0D110F; --on-blue:#0D110F; --on-yellow:#0D110F; --on-green:#0D110F; --on-graphite:#0D110F; --on-orange:#0D110F;
    --focus:#6E9BEF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#191E1C; --ink:#E6EBE8; --muted:#9BA6A0; --line:#2E3532;
  --red:#EC6158; --blue:#6E9BEF; --yellow:#F2C230; --green:#56C17D; --graphite:#98A39E; --orange:#F0954A;
  --on-red:#0D110F; --on-blue:#0D110F; --on-yellow:#0D110F; --on-green:#0D110F; --on-graphite:#0D110F; --on-orange:#0D110F;
  --focus:#6E9BEF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-body)}
[hidden]{display:none!important}
.c-red{--day:var(--red);--on-day:var(--on-red)}
.c-blue{--day:var(--blue);--on-day:var(--on-blue)}
.c-yellow{--day:var(--yellow);--on-day:var(--on-yellow)}
.c-green{--day:var(--green);--on-day:var(--on-green)}
.c-graphite{--day:var(--graphite);--on-day:var(--on-graphite)}
.c-orange{--day:var(--orange);--on-day:var(--on-orange)}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:calc(22px + env(safe-area-inset-top,0px)) 150px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Header */
.eyebrow{font-family:var(--f-num);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(3.4rem,16vw,5.6rem);line-height:.82;letter-spacing:-.005em;text-transform:uppercase;margin:.12em 0 .18em}
.lede{color:var(--muted);max-width:58ch;margin:0;padding-left:1.2em}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;font-size:.9rem;color:var(--muted)}
.stats b{font-family:var(--f-num);font-weight:600;color:var(--ink)}

/* Strip: day-type buttons + session chips */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin:20px -16px 0;padding:10px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.modes .mode{padding:9px 9px}.modes .mode .mplate{display:none}.modes .mode .ml{font-size:min(1.4rem,4.6vw)}}
/* School schedule panel */
.sched{margin:22px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:zoom-in}
.sched img{display:block;width:100%;height:auto}
.sched.zoom{overflow:auto;cursor:zoom-out}
.sched.zoom img{width:220%;max-width:none}
.mode{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;background:var(--surface);border:2px solid var(--line);border-radius:10px;cursor:pointer;text-align:left}
.mode .mplate{flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 18%,var(--day) 20%)}
.mode .mt{display:grid;min-width:0}
.mode .ml{font-family:var(--f-display);font-weight:800;font-size:1.65rem;line-height:.95;text-transform:uppercase}
.mode .ms{font-size:.74rem;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode[aria-pressed="true"]{background:var(--day);border-color:var(--day);color:var(--on-day)}
.mode[aria-pressed="true"] .ms{color:var(--on-day)}
.mode[aria-pressed="true"] .mplate{background:radial-gradient(circle,var(--day) 0 18%,var(--on-day) 20%)}

.tabs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px}
@media (max-width:440px){.tabs.many{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tab{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tab .disc{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 24%,var(--day) 26%)}
.tab .d{font-family:var(--f-display);font-weight:800;font-size:min(1.15rem,4.4vw);max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1;text-transform:uppercase;white-space:nowrap}
.tab .n{font-size:.68rem;line-height:1;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--day);border-color:var(--day);color:var(--on-day)}
.tab[aria-selected="true"] .n{color:var(--on-day)}
.tab[aria-selected="true"] .disc{background:radial-gradient(circle,var(--day) 0 24%,var(--on-day) 26%)}
.tab .chk{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.tab .chk svg{width:9px;height:9px}

/* Session panel */
.dayhead{display:flex;align-items:center;gap:14px;margin:26px 0 4px}
.plate{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 15%,var(--ink) 16% 19%,var(--day) 20% 100%);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--day) 72%,var(--ink))}
.dayhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,11vw,3.6rem);line-height:.85;text-transform:uppercase;margin:0;text-wrap:balance}
.dayhead .meta{color:var(--muted);font-size:.95rem;margin:4px 0 0}
.upnext{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:4px;background:var(--ink);color:var(--bg);font-family:var(--f-num);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;vertical-align:.15em}
.progress{display:flex;align-items:center;gap:12px;margin:14px 0 6px;font-family:var(--f-num);font-size:.82rem;color:var(--muted)}
.progress b{color:var(--ink);font-weight:600}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--day);transition:width .3s ease}
.note{color:var(--muted);font-size:.95rem;margin:4px 0 14px;max-width:62ch}
.banner{margin:0 0 14px;padding:12px 14px;border-radius:10px;background:var(--day);color:var(--on-day);font-weight:700}

.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ghead b{color:var(--ink);font-weight:600}
.ex{padding:14px;display:grid;gap:8px}
.ex + .ex{border-top:1px solid var(--line)}
.ex-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.idx{flex:none;min-width:1.9em;font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.ex h3{flex:1 1 12rem;min-width:0;margin:0;font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;text-wrap:balance}
.rx{flex:none;font-family:var(--f-num);font-size:.86rem;font-weight:600;white-space:nowrap}
.hits{margin:0;font-size:.85rem;font-weight:700}
.hits::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--day);margin-right:.45em;vertical-align:.05em}
.how{margin:0;color:var(--muted);font-size:.95rem;max-width:62ch}
.act{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-top:4px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--muted);font-family:var(--f-num);font-weight:600;font-size:.95rem;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.set:active{transform:scale(.94)}
.set[aria-pressed="true"]{background:var(--day);border-color:var(--day);color:var(--on-day)}
.wt{display:grid;gap:3px;min-width:0}
.wt label{font-size:.78rem;color:var(--muted)}
.wt input{width:10.5rem;max-width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-family:var(--f-num);font-size:.95rem}
.wt input::placeholder{color:var(--muted);opacity:.75}
.last{font-family:var(--f-num);font-size:.76rem;color:var(--muted)}
.ex.is-done .how,.ex.is-done .hits{display:none}
.ex.is-done h3{color:var(--muted)}
.ex.is-done .rx::after{content:" · done";color:var(--muted)}
.tools{display:flex;justify-content:flex-end;margin-top:4px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:.88rem;cursor:pointer}

/* Guide */
.guide{margin-top:36px;display:grid;gap:10px}
.guide h2{font-family:var(--f-display);font-weight:800;font-size:2rem;text-transform:uppercase;line-height:1;margin:0 0 4px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding-inline:14px}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:13px;font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-transform:uppercase;line-height:1.1}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-num);font-size:1.1rem;color:var(--muted)}
details[open] summary::after{content:"–"}
.dbody{padding-bottom:14px}
.dbody p,.dbody li{max-width:62ch}
.dbody p{margin:0 0 10px}
.dbody ol,.dbody ul{margin:0 0 10px;padding-left:1.3em}
.dbody li{margin-bottom:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
th{font-family:var(--f-num);font-weight:600;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sync{margin-top:18px;font-family:var(--f-num);font-size:.76rem;color:var(--muted)}

/* Rest timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.tline{position:absolute;left:0;top:0;height:4px;width:100%;background:var(--day);transform-origin:left center}
.tin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.clock{font-family:var(--f-num);font-weight:600;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch}
.tlabel{flex:1;min-width:0;font-size:.85rem;line-height:1.3}
.tlabel b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{flex:none;background:transparent;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:6px;padding:9px 11px;font-size:.85rem;cursor:pointer}
.timer.is-flash .clock{display:none}
@media (max-width:380px){.clock{font-size:1.8rem}.tbtn{padding:8px 8px}.mode .ml{font-size:1.4rem}.mode .mplate{width:24px;height:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow">Cardio day or weight day</p>
    <h1>BCIT Schedule</h1>
    <ul class="lede">
      <li>Listen to your body.</li>
      <li>Stop when you're doing too much.</li>
      <li>Listen to your nervous system.</li>
    </ul>
    <div class="stats"><span>This week: <b id="wkWeight">0</b> weight · <b id="wkCardio">0</b> cardio</span><span>Today: <b id="todayLabel">—</b></span></div>
  </header>

  <nav class="strip" aria-label="Choose a workout">
    <div class="modes" id="modes">
      <button type="button" class="mode c-blue" data-mode="school" aria-pressed="false">
        <span class="mplate" aria-hidden="true"></span><span class="mt"><span class="ml">School Schedule</span><span class="ms" id="msSchool">Timetable</span></span>
      </button>
      <button type="button" class="mode c-orange" data-mode="cardio" aria-pressed="false">
        <span class="mplate" aria-hidden="true"></span><span class="mt"><span class="ml">Cardio Day</span><span class="ms" id="msCardio">20 min bike</span></span>
      </button>
      <button type="button" class="mode c-red" data-mode="weight" aria-pressed="false">
        <span class="mplate" aria-hidden="true"></span><span class="mt"><span class="ml">Weight Day</span><span class="ms" id="msWeight">3 exercises</span></span>
      </button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </nav>
  <main id="day"></main>

  <section class="guide" aria-label="Sync status">
    <p class="sync" id="sync">Your log is saved in this browser.</p>
  </section>
</div>

<div class="timer c-graphite" id="timer" hidden role="status" aria-live="polite">
  <div class="tline" id="tline"></div>
  <div class="tin">
    <div class="clock" id="clock">0:00</div>
    <div class="tlabel"><b id="tTitle">Rest</b><span id="tSub"></span></div>
    <button class="tbtn" id="tAdd" type="button">+15 s</button>
    <button class="tbtn" id="tSkip" type="button">Skip</button>
  </div>
</div>

<script>
(function(){
"use strict";
function E(k,n,s,r,rest,hits,how,start){return {k:k,n:n,s:s,r:r,rest:rest,hits:hits,how:how,start:start||""};}

var SESSIONS=[
 /* ----- Weight day ----- */
 {id:"lift",type:"weight",name:"Weight Day",sub:"",color:"red",meta:"3 exercises · 3 sets each",blocks:[
  {ex:[
   E("lift-rowsquat","Rows and squats",3,"10",90,"",""),
   E("lift-pullpush","Pull-ups / push-ups",3,"5",60,"","","Bodyweight"),
   E("lift-flytwist","Bent-over flies and ab twists",3,"20",45,"","")
  ]}
 ]},
 /* ----- Cardio day ----- */
 {id:"c-bike",type:"cardio",name:"Bike",sub:"20 min",color:"orange",meta:"Exercise bike · 20 min",note:"Tap the check mark when you finish your 20 minutes.",blocks:[
  {ex:[
   E("c-bike-main","Exercise bike",1,"20 min",0,"Heart and lungs, legs","20 minutes of biking at a steady pace. Use the box to note the resistance level or distance so you can match or beat it next time.","Any level")
  ]}
 ]}
];
var BYID={};SESSIONS.forEach(function(s){BYID[s.id]=s;});
function ofType(t){return SESSIONS.filter(function(s){return s.type===t;});}
var ROTATION=["lift"];

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return iso(new Date());}
function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtShort(s){try{return parseISO(s).toLocaleDateString("en-CA",{month:"short",day:"numeric"});}catch(e){return s;}}
function fmtToday(){try{return new Date().toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"});}catch(e){return today();}}
function weekDates(){var d=new Date(),dow=(d.getDay()+6)%7,out=[];for(var i=0;i<7;i++){out.push(iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow+i)));}return out;}

/* ---------- state ---------- */
var LS="block2-workouts-v1",LSUI="block2-ui-v1";
function normalize(s){
  s=(s&&typeof s==="object")?s:{};
  var out={weights:{},ticks:{date:"",sets:{}},completed:{},updated:+s.updated||0};
  if(s.weights&&typeof s.weights==="object"){Object.keys(s.weights).forEach(function(k){var a=s.weights[k];if(Array.isArray(a)){out.weights[k]=a.filter(function(e){return e&&typeof e.d==="string"&&typeof e.v==="string";}).slice(-6);}});}
  if(s.ticks&&typeof s.ticks==="object"){out.ticks.date=String(s.ticks.date||"");var ts=s.ticks.sets||{};Object.keys(ts).forEach(function(k){var n=+ts[k];if(n>0)out.ticks.sets[k]=n;});}
  if(s.completed&&typeof s.completed==="object"){Object.keys(s.completed).forEach(function(d){var a=s.completed[d];if(Array.isArray(a)&&a.length)out.completed[d]=a.filter(function(x){return typeof x==="string";});});}
  return out;
}
function loadLocal(){try{var raw=localStorage.getItem(LS);return normalize(raw?JSON.parse(raw):{});}catch(e){return normalize({});}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
var state=loadLocal();
function ensureToday(){var t=today();if(state.ticks.date!==t){state.ticks={date:t,sets:{}};}}
ensureToday();
function prune(){var ds=Object.keys(state.completed).sort();while(ds.length>60){delete state.completed[ds.shift()];}}
function hasData(){return Object.keys(state.weights).length>0||Object.keys(state.completed).length>0||Object.keys(state.ticks.sets).length>0;}
function touch(){state.updated=Date.now();prune();saveLocal();queueRemote();}

/* UI choice (per browser convenience only) */
var ui={mode:"weight",cardio:"c-bike"};
try{var u=JSON.parse(localStorage.getItem(LSUI)||"{}");if(u.mode==="cardio"||u.mode==="weight"||u.mode==="school")ui.mode=u.mode;if(BYID[u.cardio]&&BYID[u.cardio].type==="cardio")ui.cardio=u.cardio;}catch(e){}
function saveUI(){try{localStorage.setItem(LSUI,JSON.stringify(ui));}catch(e){}}

/* ---------- account sync (db) ---------- */
var ref=null,remoteReady=false,remoteOff=false,saving=false,again=false,rTimer=null,retried=false;
var syncEl=document.getElementById("sync");
function setSync(mode){syncEl.textContent=mode==="account"?"Your log is saved to your Claude account, so it follows you between phone and computer.":"Your log is saved in this browser.";}
function queueRemote(delay){if(!ref||remoteOff||!remoteReady)return;clearTimeout(rTimer);rTimer=setTimeout(function(){rTimer=null;pushRemote();},delay||900);}
function pushRemote(){
  if(!ref||remoteOff)return;
  if(saving){again=true;return;}
  saving=true;
  ref.set(JSON.parse(JSON.stringify(state))).then(function(){
    retried=false;setSync("account");
  },function(e){
    var c=e&&e.code;
    if(c==="unavailable"&&!retried){retried=true;again=true;}
    else if(c==="resource_exhausted"){again=false;queueRemote(8000);}
    else if(c==="unavailable"){retried=false;}
    else{remoteOff=true;setSync("local");}
  }).then(function(){saving=false;if(again){again=false;queueRemote(1200+Math.random()*1000);}});
}
function onRemote(snap){
  var md=snap.metadata||{};
  if(md.hasPendingWrites)return;
  if(!snap.exists){if(md.fromCache)return;remoteReady=true;setSync("account");if(hasData())queueRemote(300);return;}
  remoteReady=true;setSync("account");
  if(rTimer||saving)return;
  var remote=normalize(JSON.parse(JSON.stringify(snap.data()||{})));
  if(JSON.stringify(remote)===JSON.stringify(state))return;
  if((remote.updated||0)<(state.updated||0)){queueRemote(300);return;}
  state=remote;ensureToday();saveLocal();scheduleRender();
}
function connect(){
  var c=window.claude;
  if(!c||typeof c.use!=="function")return;
  Promise.all([c.use("db"),c.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(uid){
      if(!uid)return;
      try{ref=db.doc("data/users/"+uid+"/block2");}catch(e){ref=null;return;}
      ref.onSnapshot(onRemote,function(){remoteOff=true;setSync("local");});
    });
  }).catch(function(){});
}

/* ---------- school schedule image ---------- */

/* ---------- rotation ---------- */
/* Next gym session = the one after whichever rotation session was finished most recently (today counts once it's done). */
function upNextWeight(){
  var ds=Object.keys(state.completed).sort().reverse();
  for(var i=0;i<ds.length;i++){
    var list=state.completed[ds[i]];
    for(var j=list.length-1;j>=0;j--){var at=ROTATION.indexOf(list[j]);if(at>-1)return ROTATION[(at+1)%ROTATION.length];}
  }
  return ROTATION[0];
}
function startedToday(){
  var best=null,bestN=0;
  SESSIONS.forEach(function(s){var n=0;allEx(s).forEach(function(e){n+=doneSets(e.k);});if(n>bestN){bestN=n;best=s;}});
  return best;
}

/* ---------- rendering ---------- */
var tabsEl=document.getElementById("tabs"),dayEl=document.getElementById("day"),modesEl=document.getElementById("modes");
var current="lift",pendingRender=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch];});}
function allEx(day){var a=[];day.blocks.forEach(function(b){a=a.concat(b.ex);});return a;}
function doneSets(k){return state.ticks.sets[k]||0;}
function isCompleteThisWeek(id){var wk=weekDates();return wk.some(function(d){return (state.completed[d]||[]).indexOf(id)>-1;});}
var CHECK='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2l2.2 2.2L8.5 2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderModes(){
  modesEl.querySelectorAll(".mode").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===ui.mode));});
  var nx=BYID[upNextWeight()];
  modesEl.querySelector('[data-mode="weight"]').className="mode c-"+(ui.mode==="weight"?BYID[current].color:"red");
  document.getElementById("msWeight").textContent="3 exercises";
  document.getElementById("msCardio").textContent="20 min bike";
}
function renderTabs(){
  tabsEl.hidden=true;
  if(true){tabsEl.innerHTML="";return;}
  var list=ofType(ui.mode),nx=upNextWeight(),h="";
  tabsEl.style.setProperty("--n",list.length);
  tabsEl.classList.toggle("many",list.length>4);
  tabsEl.setAttribute("aria-label",ui.mode==="weight"?"Weight sessions":"Cardio sessions");
  list.forEach(function(d){
    var done=isCompleteThisWeek(d.id),sel=d.id===current;
    var sub=(ui.mode==="weight"&&d.id===nx)?"Up next":d.sub;
    h+='<button type="button" role="tab" id="tab-'+d.id+'" class="tab c-'+d.color+'" aria-selected="'+sel+'" aria-controls="day" tabindex="'+(sel?0:-1)+'" data-tab="'+d.id+'">'+
      '<span class="disc" aria-hidden="true"></span><span class="d">'+esc(d.name)+'</span><span class="n">'+esc(sub)+'</span>'+
      (done?'<span class="chk" title="Done this week">'+CHECK+'</span>':"")+'</button>';
  });
  tabsEl.innerHTML=h;
}
function lastEntry(k){var t=today(),a=state.weights[k]||[];for(var i=a.length-1;i>=0;i--){if(a[i].d<t)return a[i];}return null;}
function todayEntry(k){var t=today(),a=state.weights[k]||[];for(var i=0;i<a.length;i++){if(a[i].d===t)return a[i];}return null;}

function exHTML(ex,tag,cardio){
  var n=doneSets(ex.k),last=lastEntry(ex.k),tv=todayEntry(ex.k);
  var sets="",unit=cardio&&ex.s>1?"round":"set";
  for(var i=0;i<ex.s;i++){sets+='<button type="button" class="set" data-k="'+ex.k+'" data-i="'+i+'" aria-pressed="'+(i<n)+'" aria-label="'+esc(ex.n)+', '+unit+' '+(i+1)+'">'+(ex.s===1?"✓":(i+1))+'</button>';}
  var lastTxt=last?("Last: "+last.v+" · "+fmtShort(last.d)):(ex.first||(ex.start?("Start with: "+ex.start):"First time: pick a weight with 2 reps to spare"));
  var ph=ex.ph||(last?last.v:(ex.start&&ex.start.length<14?ex.start:"e.g. 20 lb"));
  var lbl=ex.lbl||(cardio?"Notes today":"Weight today");
  var id="w-"+ex.k;
  return '<article class="ex'+(n>=ex.s?" is-done":"")+'" id="ex-'+ex.k+'">'+
    '<div class="ex-top"><span class="idx">'+tag+'</span><h3>'+esc(ex.n)+'</h3><span class="rx">'+(ex.s>1?ex.s+' × ':'')+esc(ex.r)+'</span></div>'+
    (ex.hits?'<p class="hits">'+esc(ex.hits)+'</p>':'')+
    (ex.how?'<p class="how">'+esc(ex.how)+'</p>':'')+
    '<div class="act"><div class="sets" role="group" aria-label="'+(unit==="round"?"Rounds":"Sets")+'">'+sets+'</div>'+
    '<div class="wt"><label for="'+id+'">'+lbl+'</label><input id="'+id+'" type="text" autocomplete="off" maxlength="40" data-w="'+ex.k+'" placeholder="'+esc(ph)+'" value="'+esc(tv?tv.v:"")+'"><span class="last">'+esc(lastTxt)+'</span></div></div>'+
    '</article>';
}
function renderDay(){
  if(ui.mode==="school"){renderSchool();renderModes();return;}
  var d=BYID[current],h="",cardio=d.type==="cardio";
  dayEl.className="c-"+d.color;
  var badge="";
  h+='<div class="dayhead"><div class="plate" aria-hidden="true"></div><div><h2>'+esc(d.name)+badge+'</h2><p class="meta">'+esc(d.meta)+'</p></div></div>';
  h+='<div class="progress"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>';
  if(d.note)h+='<p class="note">'+esc(d.note)+'</p>';
  h+='<div class="banner" id="banner" hidden></div>';
  var num=1;
  d.blocks.forEach(function(b){
    h+='<section class="block">';
    if(b.label)h+='<div class="ghead"><b>'+esc(b.label)+'</b><span>'+esc(b.note||"")+'</span></div>';
    b.ex.forEach(function(ex,j){var tag=b.tags?b.tags[j]:String(num++);h+=exHTML(ex,tag,cardio);});
    h+='</section>';
  });
  h+='<div class="tools"><button type="button" class="ghost" id="resetDay">Clear today’s ticks for this session</button></div>';
  dayEl.innerHTML=h;
  paintProgress();
}
function paintProgress(){
  if(ui.mode==="school")return;
  var d=BYID[current];
  var ex=allEx(d),tot=0,done=0;
  ex.forEach(function(e){tot+=e.s;done+=Math.min(doneSets(e.k),e.s);});
  var pt=document.getElementById("progTxt"),pb=document.getElementById("progBar"),bn=document.getElementById("banner");
  if(pt)pt.innerHTML="<b>"+done+"</b> of "+tot+(d.type==="cardio"?" steps":" sets");
  if(pb)pb.style.width=(tot?Math.round(done/tot*100):0)+"%";
  var logged=(state.completed[today()]||[]).indexOf(d.id)>-1;
  if(bn){bn.hidden=!logged;bn.textContent=(d.type==="cardio"?"Cardio":"Session")+" done and logged for "+fmtToday()+".";}
}
function renderStats(){
  var w=0,c=0;
  weekDates().forEach(function(d){(state.completed[d]||[]).forEach(function(id){var s=BYID[id];if(!s)return;if(s.type==="cardio")c++;else w++;});});
  document.getElementById("eyebrow").textContent="Weight day · Cardio day";
  document.getElementById("wkWeight").textContent=String(w);
  document.getElementById("wkCardio").textContent=String(c);
  document.getElementById("todayLabel").textContent=fmtToday();
}
function renderAll(){pendingRender=false;renderModes();renderTabs();renderDay();renderStats();}
function scheduleRender(){var a=document.activeElement;if(a&&a.tagName==="INPUT"&&dayEl.contains(a)){pendingRender=true;}else{renderAll();}}
dayEl.addEventListener("focusout",function(){if(!pendingRender)return;setTimeout(function(){var a=document.activeElement;if(!(a&&a.tagName==="INPUT"&&dayEl.contains(a)))renderAll();},0);});

/* ---------- interactions ---------- */
function findEx(k){for(var i=0;i<SESSIONS.length;i++){var bl=SESSIONS[i].blocks;for(var j=0;j<bl.length;j++){for(var m=0;m<bl[j].ex.length;m++){if(bl[j].ex[m].k===k)return {day:SESSIONS[i],block:bl[j],idx:m,ex:bl[j].ex[m]};}}}return null;}
function checkComplete(d){
  var t=today(),list=state.completed[t]||[],ex=allEx(d);
  var complete=ex.every(function(e){return doneSets(e.k)>=e.s;});
  var at=list.indexOf(d.id);
  if(complete&&at<0){list.push(d.id);state.completed[t]=list;return "done";}
  if(!complete&&at>-1){list.splice(at,1);if(list.length)state.completed[t]=list;else delete state.completed[t];}
  return complete?"same":"";
}
dayEl.addEventListener("click",function(ev){
  var fig=ev.target.closest("#schFig");if(fig){fig.classList.toggle("zoom");return;}
  var b=ev.target.closest(".set");
  if(b){
    ensureToday();
    var k=b.getAttribute("data-k"),i=+b.getAttribute("data-i"),f=findEx(k);if(!f)return;
    var n=doneSets(k),nn=(i<n)?i:i+1;
    if(nn>0)state.ticks.sets[k]=nn;else delete state.ticks.sets[k];
    var art=document.getElementById("ex-"+k);
    if(art){art.querySelectorAll(".set").forEach(function(s,x){s.setAttribute("aria-pressed",String(x<nn));});art.classList.toggle("is-done",nn>=f.ex.s);}
    var res=checkComplete(f.day);
    touch();paintProgress();renderModes();renderTabs();renderStats();
    if(nn>n){
      primeAudio();keepAwake();
      if(res==="done"){stopTimer();flash(f.day.type==="cardio"?"Cardio done":"Session done","Nice work. It's logged for this week.",f.day.color,5000);}
      else if(f.ex.rest>0&&nn<f.ex.s){startTimer(f.ex.rest,f.ex.n,(f.day.type==="cardio"?"Climb ":"Set ")+nn+" of "+f.ex.s+" done",f.day.color);}
      else if(f.ex.rest>0&&f.day.type!=="cardio"){startTimer(f.ex.rest,f.ex.n,"Set "+nn+" of "+f.ex.s+" done",f.day.color);}
      else if(f.ex.rest===0&&f.block.tags&&f.block.ex[f.idx+1]){flash("Straight to "+f.block.tags[f.idx+1],f.block.ex[f.idx+1].n,f.day.color,4000);}
    }
    return;
  }
  if(ev.target.closest("#resetDay")){
    ensureToday();
    var d=BYID[current];
    allEx(d).forEach(function(e){delete state.ticks.sets[e.k];});
    checkComplete(d);touch();stopTimer();renderAll();
  }
});
var wTimers={};
dayEl.addEventListener("input",function(ev){
  var inp=ev.target;if(!inp.matches("input[data-w]"))return;
  var k=inp.getAttribute("data-w");
  clearTimeout(wTimers[k]);
  wTimers[k]=setTimeout(function(){
    ensureToday();
    var v=inp.value.trim().slice(0,40),t=today(),a=(state.weights[k]||[]).slice(),at=-1;
    for(var i=0;i<a.length;i++){if(a[i].d===t){at=i;break;}}
    if(!v){if(at>-1)a.splice(at,1);}else if(at>-1){a[at]={d:t,v:v};}else{a.push({d:t,v:v});}
    if(a.length)state.weights[k]=a.slice(-6);else delete state.weights[k];
    touch();
  },350);
});
modesEl.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-mode]");if(!b)return;
  var m=b.getAttribute("data-mode");
  if(m===ui.mode)return;
  if(m==="school"){ui.mode="school";saveUI();renderModes();renderTabs();renderDay();return;}
  ui.mode=m;
  select(m==="cardio"?ui.cardio:upNextWeight());
});
tabsEl.addEventListener("click",function(ev){var t=ev.target.closest("[data-tab]");if(!t)return;select(t.getAttribute("data-tab"));});
tabsEl.addEventListener("keydown",function(ev){
  if(ev.key!=="ArrowRight"&&ev.key!=="ArrowLeft")return;
  ev.preventDefault();
  var list=ofType(ui.mode).map(function(s){return s.id;}),at=list.indexOf(current),L=list.length;
  select(list[(at+(ev.key==="ArrowRight"?1:L-1))%L]);
  var t=document.getElementById("tab-"+current);if(t)t.focus();
});
function select(id){
  current=id;ui.mode=BYID[id].type;if(ui.mode==="cardio")ui.cardio=id;saveUI();
  renderModes();renderTabs();renderDay();
  var strip=document.querySelector(".strip");
  if(strip&&dayEl.getBoundingClientRect().top<strip.offsetHeight){dayEl.scrollIntoView({block:"start"});window.scrollBy(0,-strip.offsetHeight-8);}
}
function initialPick(){
  var s=startedToday();
  if(s){current=s.id;ui.mode=s.type;return;}
  current=ui.mode==="cardio"?ui.cardio:upNextWeight();
}
initialPick();

/* ---------- rest timer ---------- */
var timerEl=document.getElementById("timer"),clockEl=document.getElementById("clock"),tTitle=document.getElementById("tTitle"),tSub=document.getElementById("tSub"),tLine=document.getElementById("tline");
var tEnd=0,tTotal=0,tIv=null,hideT=null,token=0;
function fmtClock(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function colorTimer(c){timerEl.className="timer c-"+c;}
function startTimer(sec,title,sub,color){
  clearTimeout(hideT);clearInterval(tIv);token++;
  colorTimer(color);tTotal=sec;tEnd=Date.now()+sec*1000;
  tTitle.textContent="Rest · "+title;tSub.textContent=sub;
  timerEl.hidden=false;paintTimer();tIv=setInterval(paintTimer,250);
}
function paintTimer(){
  var left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  clockEl.textContent=fmtClock(left);
  tLine.style.transform="scaleX("+(tTotal?left/tTotal:0)+")";
  if(left<=0){clearInterval(tIv);tIv=null;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    tTitle.textContent="Rest over";tSub.textContent="Time to go again.";
    var my=token;hideT=setTimeout(function(){if(my===token)timerEl.hidden=true;},6000);}
}
function flash(title,sub,color,ms){
  clearTimeout(hideT);clearInterval(tIv);tIv=null;token++;
  colorTimer(color);timerEl.classList.add("is-flash");tLine.style.transform="scaleX(1)";
  tTitle.textContent=title;tSub.textContent=sub;timerEl.hidden=false;
  var my=token;hideT=setTimeout(function(){if(my===token)timerEl.hidden=true;},ms||4000);
}
function stopTimer(){clearInterval(tIv);tIv=null;clearTimeout(hideT);token++;timerEl.hidden=true;}
document.getElementById("tAdd").addEventListener("click",function(){
  if(!tIv){var c=(timerEl.className.match(/c-(\w+)/)||[])[1]||"graphite";startTimer(15,"extra time","",c);return;}
  tEnd+=15000;tTotal+=15;paintTimer();
});
document.getElementById("tSkip").addEventListener("click",stopTimer);

var ac=null;
function primeAudio(){try{if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==="suspended")ac.resume();}catch(e){}}
function beep(){
  if(!ac)return;
  try{[0,0.28,0.56].forEach(function(off){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+off;o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.2);});}catch(e){}
}
var wl=null,wantWake=false;
function keepAwake(){wantWake=true;try{if(navigator.wakeLock&&!wl){navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null;});}).catch(function(){});}}catch(e){}}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible")return;
  if(wantWake)keepAwake();
  if(state.ticks.date!==today()){ensureToday();renderAll();}
  if(tIv)paintTimer();
});

renderAll();
setSync("local");
connect();
})();
</script>
</body></html>
